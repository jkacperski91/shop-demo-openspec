# Local development environment only.
# Credentials below are fixed, non-secret defaults for local development and
# must never be reused in any deployed environment.
services:
  db:
    image: postgres:16-alpine
    container_name: shop-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopdemo
      POSTGRES_USER: shopdemo
      POSTGRES_PASSWORD: shopdemo
    ports:
      # Host port 5433 (not the default 5432) to avoid colliding with any
      # PostgreSQL instance already installed natively on a developer's
      # machine. The container's internal port stays the standard 5432.
      - "5433:5432"
    volumes:
      - shop-demo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopdemo -d shopdemo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shop-demo-db-data:
